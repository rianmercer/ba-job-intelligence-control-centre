<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BA Job Intelligence Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f6f8;
  --card: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --blue: #2563eb;
  --blue-light: #eff6ff;
  --green: #10b981;
  --green-light: #ecfdf5;
  --purple: #8b5cf6;
  --purple-light: #f5f3ff;
  --amber: #f59e0b;
  --amber-light: #fffbeb;
  --rose: #f43f5e;
  --rose-light: #fff1f2;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.03);
  --shadow-lg: 0 10px 25px -3px rgba(15,23,42,0.06), 0 4px 6px -4px rgba(15,23,42,0.02);
  --radius-lg: 20px;
  --radius-md: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; border: none; background: none; }
.hidden { display: none !important; }

/* Header */
.top-nav {
  height: 68px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 40;
}
.brand-group { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: #090d16; color: #fff;
  display: grid; place-items: center;
  font-weight: 800; font-size: 15px; letter-spacing: -0.5px;
}
.brand-title { font-size: 15px; font-weight: 800; color: #0f172a; line-height: 1.2; }
.brand-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.header-actions { display: flex; align-items: center; gap: 12px; }
.meta-chip {
  display: flex; align-items: center; gap: 8px;
  background: #ffffff; border: 1px solid var(--border);
  border-radius: 12px; padding: 6px 14px;
  font-size: 12px; font-weight: 600; color: #334155;
}
.status-pill {
  display: flex; align-items: center; gap: 8px;
  background: var(--green-light); border: 1px solid #a7f3d0;
  border-radius: 12px; padding: 6px 14px;
  font-size: 12px; font-weight: 700; color: #047857;
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #10b981; box-shadow: 0 0 0 2px rgba(16,185,129,0.25);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
.avatar-badge {
  width: 36px; height: 36px; border-radius: 50%;
  background: #e2e8f0; color: #475569;
  display: grid; place-items: center;
  font-weight: 700; font-size: 12px;
}

/* Shell Layout */
.app-layout {
  display: grid;
  grid-template-columns: 195px minmax(0, 1fr);
  min-height: calc(100vh - 68px);
}
aside {
  background: #ffffff;
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.nav-link {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: 12px;
  font-size: 13px; font-weight: 600; color: #64748b;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.nav-link:hover { background: #f8fafc; color: #0f172a; }
.nav-link.active {
  background: var(--blue-light); color: var(--blue);
  font-weight: 700;
}
.nav-icon { font-size: 16px; width: 20px; text-align: center; }

.side-card {
  margin-top: auto;
  background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 100%);
  border: 1px solid #dcfce7;
  border-radius: 16px;
  padding: 16px;
}
.side-card-icon {
  width: 28px; height: 28px; border-radius: 8px;
  background: #10b981; color: #fff; display: grid;
  place-items: center; margin-bottom: 10px; font-size: 14px;
}
.side-card h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: #0f172a; }
.side-card p { font-size: 11px; line-height: 1.45; color: #64748b; }

main { padding: 22px 28px 48px; max-width: 1540px; margin: 0 auto; width: 100%; }

/* Refined Dashboard View */
.dash-container { display: flex; flex-direction: column; gap: 18px; }

/* Hero Banner & KPI Row */
.hero-row { display: grid; grid-template-columns: 1.35fr 2.15fr; gap: 16px; align-items: stretch; }
.narrator-card {
  background: linear-gradient(135deg, #ffffff 0%, #f8fbfd 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
}
.narrator-img-wrap {
  width: 205px; height: 210px; flex: 0 0 205px; z-index: 2;
  position: relative; margin-bottom: -16px;
  display:flex; align-items:flex-end; justify-content:center;
  animation: floatNarrator 4.5s ease-in-out infinite;
}
.narrator-img-wrap img.narrator-scene {
  width: 100%; height: 100%; object-fit: contain; object-position: center bottom;
  display: block; filter: drop-shadow(0 12px 16px rgba(0,0,0,0.08));
  transform-origin: 50% 85%;
}
@keyframes narratorTalk {
  0%,100% { transform: translateY(0) rotate(0deg) scale(1); }
  45% { transform: translateY(-2px) rotate(-0.35deg) scale(1.006); }
  70% { transform: translateY(1px) rotate(0.25deg) scale(1); }
}
.narrator-scene { animation: narratorTalk 3.8s ease-in-out infinite; }
@keyframes floatNarrator {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.narrator-bubble {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  padding: 18px 20px;
  box-shadow: var(--shadow-md);
  position: relative;
  z-index: 2;
  margin-left: -10px;
}
.narrator-bubble h2 {
  font-size: 20px; font-weight: 800; color: #0f172a;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.narrator-bubble p {
  font-size: 12.5px; line-height: 1.55; color: #475569;
}
.narrator-bubble b { color: var(--blue); font-weight: 700; }

.kpi-deck { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.kpi-card {
  background: #ffffff; border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px;
  box-shadow: var(--shadow-sm); display: flex; flex-direction: column;
  justify-content: space-between; transition: transform 0.2s, box-shadow 0.2s;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.kpi-icon {
  width: 36px; height: 36px; border-radius: 11px;
  display: grid; place-items: center; font-size: 16px;
  margin-bottom: 12px;
}
.kpi-val { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #0f172a; line-height: 1.1; margin-bottom: 2px; }
.kpi-lbl { font-size: 11px; font-weight: 700; color: #475569; }
.kpi-growth {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 700; color: #10b981; margin-top: 4px;
}
.kpi-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.spark-bars { display: flex; gap: 2px; align-items: flex-end; height: 16px; margin-top: 8px; }
.spark-bars i { flex: 1; border-radius: 2px; }

/* Visual Grids */
.visual-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; }
.card-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 20px;
  box-shadow: var(--shadow-sm);
}
.box-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.box-header h3 { font-size: 14.5px; font-weight: 800; color: #0f172a; }
.box-header h3 span { font-size: 12px; font-weight: 500; color: var(--text-muted); }
.box-legend { display: flex; gap: 14px; font-size: 11px; font-weight: 600; color: #64748b; }
.box-legend span { display: flex; align-items: center; gap: 5px; }
.box-legend i { width: 8px; height: 8px; border-radius: 50%; }

/* Trend Bars */
.chart-body {
  height: 230px; display: flex; align-items: flex-end;
  gap: 12px; padding: 10px 4px 28px;
  position: relative; border-bottom: 1px solid #f1f5f9;
}
.chart-col {
  flex: 1; display: flex; align-items: flex-end; justify-content: center;
  gap: 4px; height: 100%; position: relative;
}
.col-bar {
  width: 24%; border-radius: 5px 5px 2px 2px;
  position: relative; transition: height 0.4s ease;
}
.col-bar.s { background: #3b82f6; }
.col-bar.v { background: #10b981; }
.col-bar.m { background: #8b5cf6; }
.col-bar-val {
  position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  font-size: 8.5px; font-weight: 700; color: #475569;
}
.col-date {
  position: absolute; bottom: -24px; font-size: 10px;
  font-weight: 600; color: #64748b; white-space: nowrap;
}
.col-highlight {
  position: absolute; inset: -8px -6px 20px;
  background: #f1f5f9; border-radius: 12px; z-index: 0;
}

/* Map & Top Countries */
.map-layout { display: grid; grid-template-columns: 1fr 140px; gap: 12px; min-height: 220px; align-items: center; }
.vector-map {
  height: 210px; position: relative;
  background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
  background-size: 8px 8px; border-radius: 14px;
}
.map-pin {
  position: absolute; background: #ffffff;
  border: 1px solid #cbd5e1; border-radius: 10px;
  padding: 5px 8px; box-shadow: var(--shadow-md);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; gap: 5px;
}
.map-pin b { color: #0f172a; font-size: 10.5px; }
.map-pin span { color: var(--text-muted); font-size: 9px; }
.pin-dot { width: 7px; height: 7px; border-radius: 50%; }

.map-rank-list { display: flex; flex-direction: column; gap: 8px; }
.map-rank-item {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; font-weight: 600; color: #334155;
  padding: 6px 8px; background: #f8fafc; border-radius: 8px;
}
.map-rank-item b { color: var(--blue); font-weight: 800; }

/* Lower Tri-Deck */
.tri-grid { display: grid; grid-template-columns: 1.15fr 0.95fr 1fr; gap: 16px; }

/* Stepper Journey */
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); position: relative; margin-top: 24px; }
.stepper::before {
  content: ""; position: absolute; left: 12%; right: 12%; top: 14px;
  height: 2px; background: #e2e8f0; z-index: 1;
}
.step-node { text-align: center; position: relative; z-index: 2; }
.step-circle {
  width: 30px; height: 30px; border-radius: 50%;
  margin: 0 auto 10px; background: #ffffff;
  border: 2px solid var(--border); display: grid;
  place-items: center; font-size: 12px; font-weight: 800; color: #94a3b8;
}
.step-node.done .step-circle {
  background: var(--green); border-color: var(--green); color: #fff;
  box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
}
.step-node.active .step-circle {
  background: #ffffff; border-color: var(--blue); color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
}
.step-title { font-size: 11px; font-weight: 800; color: #0f172a; }
.step-time { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
.step-stat { font-size: 9.5px; font-weight: 600; color: #334155; margin-top: 3px; }

/* Donut Breakdown */
.donut-box { display: flex; align-items: center; gap: 16px; padding-top: 8px; }
.donut-ring {
  width: 120px; height: 120px; border-radius: 50%;
  position: relative; flex-shrink: 0;
}
.donut-ring::after {
  content: ""; position: absolute; inset: 24px;
  background: #ffffff; border-radius: 50%;
}
.donut-center {
  position: absolute; inset: 0; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 3;
}
.donut-center b { font-size: 22px; font-weight: 800; color: #0f172a; line-height: 1; }
.donut-center span { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

.donut-legend { display: flex; flex-direction: column; gap: 7px; flex: 1; }
.donut-legend-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; font-weight: 600; color: #334155;
}
.donut-legend-row span { display: flex; align-items: center; gap: 6px; }
.donut-legend-row i { width: 7px; height: 7px; border-radius: 50%; }

/* Source Contribution */
.source-bars { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.source-item {
  display: grid; grid-template-columns: 24px 105px 1fr 30px;
  align-items: center; gap: 8px; font-size: 11px; font-weight: 600; color: #334155;
}
.source-logo {
  width: 22px; height: 22px; border-radius: 6px;
  background: #f1f5f9; display: grid; place-items: center;
  font-size: 10px; font-weight: 800; color: #475569;
}
.source-track { height: 6px; border-radius: 99px; background: #f1f5f9; overflow: hidden; }
.source-fill { height: 100%; border-radius: 99px; background: #3b82f6; }
.source-count { text-align: right; font-weight: 700; color: #0f172a; }

/* Recent Verified Opportunities */
.recent-opps { margin-top: 4px; }
.recent-opps-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px; margin-top: 14px; width: 100%; min-width: 0; overflow: hidden;
}
.recent-card {
  background: #ffffff; border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 14px;
  display: flex; gap: 12px; align-items: flex-start;
  transition: all 0.2s ease; min-width: 0; max-width: 100%; overflow: hidden;
}
.recent-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #cbd5e1; }
.recent-logo {
  width: 38px; height: 38px; border-radius: 10px;
  background: #0f172a; color: #fff; display: grid;
  place-items: center; font-weight: 800; font-size: 14px;
  flex-shrink: 0;
}
.recent-info { flex: 1 1 auto; min-width: 0; overflow: hidden; }
.recent-title {
  font-size: 12px; font-weight: 800; color: #0f172a;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3;
  min-width: 0; max-width: 100%;
}
.recent-meta {
  font-size: 10.5px; color: var(--text-muted);
  margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.recent-tags { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.badge-direct {
  background: #ecfdf5; color: #059669; font-size: 9px;
  font-weight: 700; padding: 2px 7px; border-radius: 6px;
}
.badge-match {
  background: #eff6ff; color: #2563eb; font-size: 9px;
  font-weight: 700; padding: 2px 7px; border-radius: 6px;
}
.badge-match.moderate { background: #fffbeb; color: #d97706; }
.badge-time { font-size: 9.5px; color: #94a3b8; margin-left: auto; }

/* Interactive Creative Login Screen */
.login-screen {
  min-height: 100vh; display: grid; place-items: center;
  background: radial-gradient(circle at 10% 20%, #eff6ff 0%, #f8fafc 90%);
  padding: 20px; position: relative; overflow: hidden;
}
.login-screen::before {
  content: ""; position: absolute; width: 450px; height: 450px;
  border-radius: 50%; background: #dbeafe; filter: blur(80px);
  top: 10%; right: 15%; z-index: 1; opacity: 0.6;
}
.login-card {
  width: min(440px, 100%);
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(16px);
  border: 1px solid #ffffff;
  border-radius: 28px;
  padding: 38px;
  box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.12);
  position: relative; z-index: 2;
  text-align: center;
}
.login-brand-icon {
  width: 58px; height: 58px; border-radius: 16px;
  background: #090d16; color: #fff;
  display: grid; place-items: center;
  font-size: 24px; font-weight: 900;
  margin: 0 auto 16px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}
.login-card h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
.login-card p { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
.login-input-group { text-align: left; margin-bottom: 18px; }
.login-input-group label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 6px; }
.login-input {
  width: 100%; border: 1.5px solid var(--border);
  border-radius: 12px; padding: 12px 14px;
  font-size: 13px; outline: none; background: #ffffff;
  transition: all 0.2s ease;
}
.login-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
.login-submit-btn {
  width: 100%; background: #090d16; color: #ffffff;
  border-radius: 12px; padding: 13px; font-size: 13.5px;
  font-weight: 700; transition: all 0.2s ease;
}
.login-submit-btn:hover { background: #1e293b; transform: translateY(-1px); }

/* Standard Controls (Jobs, Runs, Settings) */
.tools-bar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.form-input {
  border: 1px solid var(--border); background: #ffffff;
  padding: 10px 14px; border-radius: 10px; font-size: 12px; outline: none;
}
.table-responsive { width: 100%; overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; min-width: 780px; }
.data-table th, .data-table td { padding: 12px; text-align: left; font-size: 11px; border-bottom: 1px solid #f1f5f9; }
.data-table th { font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: 10px; background: #f8fafc; }
.toast-notice {
  position: fixed; bottom: 20px; right: 20px;
  background: #0f172a; color: #ffffff; padding: 12px 18px;
  border-radius: 12px; font-size: 12px; font-weight: 600;
  box-shadow: var(--shadow-lg); z-index: 100;
}

@media (max-width: 1200px) {
  .hero-row, .visual-grid, .tri-grid { grid-template-columns: 1fr; }
  .kpi-deck { grid-template-columns: repeat(3, 1fr); }
  .recent-opps-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .app-layout { grid-template-columns: 1fr; }
  aside { display: none; }
  .kpi-deck { grid-template-columns: repeat(2, 1fr); }
  .recent-opps-grid { grid-template-columns: 1fr; }
  main { padding: 16px; }
}


/* Final layout hardening */
@media (max-width: 1280px) {
  .recent-opps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero-row { grid-template-columns: 1fr; }
  .narrator-card { min-height: 250px; }
}
@media (max-width: 760px) {
  .recent-opps-grid { grid-template-columns: 1fr; }
  .narrator-img-wrap { width: 170px; height: 180px; flex-basis: 170px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast-notice hidden"></div>

<script>
// v7 PASSWORDLESS: public dashboard data comes from Supabase RPC; no job/metric telemetry is hardcoded.
// Optional ?access= from the EOD email unlocks private application telemetry and privileged POST controls.
const SUPABASE_URL = "https://eybjpjhzwskfgskvnfbj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_i6MHeQhKDvJlJqVYk7diA_AdMD3WOs";
const PUBLIC_DASHBOARD_RPC = SUPABASE_URL + "/rest/v1/rpc/get_public_ba_dashboard";
const CONTROL_API = SUPABASE_URL + "/functions/v1/ba-control-api-v3";
const S = { key: "", page: "overview", selectedDate: new Intl.DateTimeFormat("en-CA", {timeZone:"Asia/Kolkata"}).format(new Date()), data: null, analytics: null, sources: [], jobs: [] };
const $ = id => document.getElementById(id);
const arr = x => Array.isArray(x) ? x : [];
const esc = x => String(x ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = x => x ? new Date(x).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Kolkata" }) : "—";
const fmtDate = d => new Date(d + "T00:00:00+05:30").toLocaleDateString("en-IN", { day: "2-digit", month: "short", timeZone: "Asia/Kolkata" });
const istTime = () => new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
const snapshotLabel = () => S.selectedDate ? fmtDate(S.selectedDate) + " (IST)" : "Selected day";
const accessParams = new URLSearchParams(location.search);
const accessToken = accessParams.get("access") || accessParams.get("token") || "";
if (accessToken) {
  accessParams.delete("access");
  accessParams.delete("token");
  const cleanQuery = accessParams.toString();
  window.history.replaceState({}, document.title, window.location.pathname + (cleanQuery ? "?" + cleanQuery : ""));
}

function toast(m) {
  $("toast").textContent = m;
  $("toast").classList.remove("hidden");
  clearTimeout(window._t);
  window._t = setTimeout(() => $("toast").classList.add("hidden"), 3000);
}

async function publicDashboard(date) {
  const res = await fetch(PUBLIC_DASHBOARD_RPC, {
    method: "POST",
    headers: { "apikey": SUPABASE_PUBLISHABLE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_date: date }),
    cache: "no-store"
  });
  const text = await res.text();
  let payload = {};
  try { payload = JSON.parse(text); } catch (_) {}
  if (!res.ok) throw new Error(payload.message || payload.error || ("HTTP " + res.status));
  if (!payload.ok || !payload.analytics) throw new Error("Backend returned an invalid public dashboard payload.");
  return payload;
}

async function secureOverview(date) {
  if (!accessToken) return null;
  const res = await fetch(CONTROL_API + "?resource=overview&date=" + encodeURIComponent(date), {
    headers: { "x-ba-control-key": accessToken, "Cache-Control": "no-cache" },
    cache: "no-store"
  });
  if (!res.ok) return null;
  const body = await res.json();
  if (body?.error) return null;
  return body;
}

async function api(resource, options = {}) {
  const method = (options.method || "GET").toUpperCase();
  if (method === "POST") {
    if (!accessToken) throw new Error("This control action requires the secure access link from the EOD email.");
    const res = await fetch(CONTROL_API + "?date=" + encodeURIComponent(S.selectedDate), {
      ...options,
      headers: { "Content-Type": "text/plain;charset=UTF-8", "x-ba-control-key": accessToken, ...(options.headers || {}) },
      cache: "no-store"
    });
    const text = await res.text();
    let body = {};
    try { body = JSON.parse(text); } catch (_) {}
    if (!res.ok || body.error) throw new Error(body.error || ("HTTP " + res.status));
    return body;
  }

  const payload = await publicDashboard(S.selectedDate);
  if (resource === "analytics") return payload.analytics || {};
  if (resource === "sources") return { sources: payload.sources || [] };
  return {
    today: payload.today,
    selectedDate: payload.selectedDate,
    jobs: payload.jobs || [],
    applications: payload.applications || [],
    runs: payload.runs || [],
    digest: payload.digest || null,
    health: payload.health || null,
    config: payload.config || {}
  };
}

async function load(date = S.selectedDate) {
  S.selectedDate = date || S.selectedDate;
  S.data = null; S.analytics = null; S.jobs = []; S.sources = [];

  const payload = await publicDashboard(S.selectedDate);
  S.analytics = payload.analytics || {};
  S.jobs = S.analytics.verifiedJobs || payload.jobs || [];
  S.data = {
    today: payload.today,
    selectedDate: payload.selectedDate,
    jobs: payload.jobs || [],
    applications: payload.applications || [],
    runs: payload.runs || [],
    digest: payload.digest || null,
    health: payload.health || null,
    config: payload.config || {}
  };
  S.sources = payload.sources || [];

  // A valid EOD access token unlocks private application/application-workflow
  // telemetry and privileged controls. The normal dashboard remains passwordless.
  const secured = await secureOverview(S.selectedDate);
  if (secured) {
    S.data.applications = secured.applications || S.data.applications;
    S.data.config = secured.config || S.data.config;
    S.data.health = secured.health || S.data.health;
    S.data.digest = secured.digest || S.data.digest;
    S.data.runs = secured.runs || S.data.runs;
  }
}

async function refreshDashboard(date = S.selectedDate, successMessage = "Dashboard refreshed") {
  const btn = $("refreshAll");
  if (btn) { btn.disabled = true; btn.textContent = "↻ Refreshing…"; }
  try {
    await load(date);
    render();
    toast(successMessage);
  } catch (err) {
    toast(err.message || "Could not refresh dashboard");
  } finally {
    const b = $("refreshAll");
    if (b) { b.disabled = false; b.textContent = "↻ Refresh"; }
  }
}

function boot() {
  load().then(() => {
    renderShell();
    render();
    toast(accessToken ? "Live Supabase dashboard connected" : "Live public dashboard connected");
  }).catch(e => {
    console.error("BA Control Centre boot:", e);
    toast("Could not load live Supabase dashboard: " + (e.message || "unknown error"));
  });
}

if (document.readyState === "loading") window.addEventListener("DOMContentLoaded", boot);
else boot();

function uniqueJobs() {
  const m = new Map();
  for (const j of arr(S.jobs)) {
    if (j.direct_url_verified !== true || j.status === "stale") continue;
    if (!m.has(j.vacancy_id)) m.set(j.vacancy_id, j);
  }
  return [...m.values()];
}

    </div>
    <div id="grid" style="display:grid; grid-template-columns:repeat(2, 1fr); gap:14px;"></div>`;

  const paint = () => {
    let x = data;
    const q = $("q").value.toLowerCase(), rg = $("rg").value, mc = $("mc").value;
    if (q) x = x.filter(j => (j.employer_name + " " + j.title + " " + j.location_text).toLowerCase().includes(q));
    if (rg) x = x.filter(j => j.region === rg);
    if (mc) x = x.filter(j => j.match_class === mc);

    $("grid").innerHTML = x.length ? x.map(j => {
      const a = apps(j.vacancy_id);
      return `
        <article class="card-box" style="padding:18px;">
          <div style="font-size:15px; font-weight:800; color:#0f172a;">${esc(j.title)}</div>
          <div style="font-size:12px; font-weight:700; color:#475569; margin-top:2px;">${esc(j.employer_name)}</div>
          <div style="display:flex; gap:6px; margin:10px 0; flex-wrap:wrap;">
            <span class="badge-direct">Direct Verified</span>
            <span class="badge-match ${j.match_class === 'moderate' ? 'moderate' : ''}">${esc(j.match_class)} • ${esc(j.match_score)}</span>
            <span style="background:#f1f5f9; padding:2px 7px; border-radius:6px; font-size:9.5px; font-weight:700;">${esc(j.region)}</span>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:11px; color:#64748b; margin-bottom:12px;">
            <div>Location: <b style="color:#0f172a;">${esc(j.location_text || "—")}</b></div>
            <div>Experience: <b style="color:#0f172a;">${esc(j.experience_min_years ?? "—")}+ yrs</b></div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f1f5f9; padding-top:12px;">
            <select class="form-input status" data-id="${j.vacancy_id}" style="padding:6px 10px; font-size:11px;">
              <option value="">${a ? 'Current: ' + esc(a.status) : 'Track application'}</option>
              <option value="saved">Saved</option><option value="applied">Applied</option>
              <option value="screening">Screening</option><option value="interview">Interview</option>
              <option value="offer">Offer</option><option value="rejected">Rejected</option>
            </select>
            <a href="${esc(j.direct_apply_url)}" target="_blank" rel="noopener noreferrer" style="background:#090d16; color:#fff; font-size:11px; font-weight:700; padding:8px 14px; border-radius:8px; text-decoration:none;">Direct Application →</a>
          </div>
        </article>`;
    }).join("") : `<div class="card-box" style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">No matching opportunities found.</div>`;

    document.querySelectorAll(".status").forEach(s => {
      const a = apps(s.dataset.id);
      if (a) s.value = a.status;
      s.onchange = () => saveStatus(s.dataset.id, s.value);
    });
  };

  ["q", "rg", "mc"].forEach(id => $(id).oninput = paint);
  paint();
}

async function saveStatus(id, status) {
  if (!status) return;
  const a = apps(id);
  try {
    await api("", { method: "POST", body: JSON.stringify({ action: "application", vacancy_id: id, status, notes: a?.notes || null }) });
    await load();
    render();
    toast("Application status updated");
  } catch (e) { toast(e.message); }
}

function runs() {
  $("main").innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <div>
        <h1 style="font-size:24px; font-weight:800;">Run History</h1>
        <p style="font-size:13px; color:var(--text-muted);">Automation telemetry for <b>${fmtDate(S.selectedDate)}</b> rendered in India Standard Time (IST).</p>
      </div>
      <button id="refreshRuns" class="login-submit-btn" style="width:auto; padding:8px 16px;">↻ Refresh Runs</button>
    </div>
    <div class="card-box table-responsive">
      <table class="data-table">
        <tr><th>Window</th><th>Status</th><th>Sources</th><th>Fetched</th><th>New</th><th>Eligible</th><th>Strong</th><th>Moderate</th><th>Errors</th><th>Finished (IST)</th></tr>
        ${["08:00", "12:00", "18:00", "22:00"].map(w => {
          const r = arr(S.data.runs).find(x => String(x.window_time).slice(0, 5) === w);
          const isPending = w > istTime();
          return `
            <tr>
              <td><b>${w} IST</b></td>
              <td><span class="badge-direct" style="${isPending && !r ? 'background:#f1f5f9; color:#64748b;' : ''}">${r ? esc(r.status) : isPending ? 'Scheduled' : 'Not recorded'}</span></td>
              <td>${r ? (r.successful_sources + '/' + r.source_count) : '—'}</td>
              <td><b>${r?.fetched_jobs ?? '—'}</b></td>
              <td>${r?.new_jobs ?? '—'}</td>
              <td>${r?.eligible_jobs ?? '—'}</td>
              <td>${r?.strong_matches ?? '—'}</td>
              <td>${r?.moderate_matches ?? '—'}</td>
              <td>${r?.error_count ?? '—'}</td>
              <td>${fmt(r?.finished_at)}</td>
            </tr>`;
        }).join("")}
      </table>
    </div>`;
  $("refreshRuns").onclick = async () => { await load(); render(); toast("Runs refreshed"); };
}

function sources() {
  $("main").innerHTML = `
    <div style="margin-bottom:20px;">
      <h1 style="font-size:24px; font-weight:800;">Source Network</h1>
      <p style="font-size:13px; color:var(--text-muted);">Configured employer feeds and ATS pipelines feeding the search engine.</p>
    </div>
    <div class="card-box table-responsive">
      <table class="data-table">
        <tr><th>Employer</th><th>Provider</th><th>Region</th><th>Type</th><th>Priority</th><th>Status</th><th>Last Success</th><th>Actions</th></tr>
        ${S.sources.map(s => `
          <tr>
            <td><b>${esc(s.employer_name)}</b><div style="font-size:9.5px; color:#94a3b8;">${esc(s.source_key)}</div></td>
            <td>${esc(s.provider)}</td>
            <td>${esc(s.region)}</td>
            <td>${s.discovery_only ? '<span class="badge-match moderate">Discovery</span>' : '<span class="badge-direct">Direct</span>'}</td>
            <td>${s.priority}</td>
            <td>${s.enabled ? '<span style="color:#059669; font-weight:700;">● Enabled</span>' : '<span style="color:#94a3b8;">Disabled</span>'}</td>
            <td>${fmt(s.last_success_at)}</td>
            <td><button class="form-input" data-src="${s.id}" style="padding:4px 8px; font-size:10px;">${s.enabled ? 'Disable' : 'Enable'}</button></td>
          </tr>`).join("")}
      </table>
    </div>`;

  document.querySelectorAll("[data-src]").forEach(b => b.onclick = async () => {
    const s = S.sources.find(x => x.id === b.dataset.src);
    try {
      await api("", { method: "POST", body: JSON.stringify({ action: "source_toggle", id: s.id, enabled: !s.enabled }) });
      await load();
      sources();
      toast("Source status updated");
    } catch (e) { toast(e.message); }
  });
}

function analytics() {
  const trend = arr(S.analytics?.trend).slice(-7);
  const srcs = arr(S.analytics?.topSources);
  $("main").innerHTML = `
    <div style="margin-bottom:20px;">
      <h1 style="font-size:24px; font-weight:800;">Telemetry & Analytics</h1>
      <p style="font-size:13px; color:var(--text-muted);">Deep telemetry across ingestion volume, verified opportunities and source contribution • ending ${fmtDate(S.selectedDate)}.</p>
    </div>
    <div class="visual-grid">
      <section class="card-box">
        <div class="box-header">
          <h3>7-Day Intake Pulse</h3>
          <div class="box-legend">
            <span><i style="background:#3b82f6;"></i>Sourced</span>
            <span><i style="background:#10b981;"></i>Verified</span>
            <span><i style="background:#8b5cf6;"></i>Strong</span>
          </div>
        </div>
        <div class="chart-body">
          ${trend.length ? trend.map((x,i) => {
            const mx = Math.max(1,...trend.map(y=>Number(y.sourced||0)));
            return `<div class="chart-col">
              ${i===trend.length-1?'<div class="col-highlight"></div>':''}
              <div class="col-bar s" style="height:${Math.max(12,Math.round(Number(x.sourced||0)/mx*160))}px"><span class="col-bar-val">${Number(x.sourced||0).toLocaleString()}</span></div>
              <div class="col-bar v" style="height:${Math.max(8,Math.round(Number(x.verified||0)/mx*160))}px"><span class="col-bar-val">${Number(x.verified||0)}</span></div>
              <div class="col-bar m" style="height:${Math.max(6,Math.round(Number(x.verifiedStrong||0)/mx*160))}px"><span class="col-bar-val">${Number(x.verifiedStrong||0)}</span></div>
              <span class="col-date">${fmtDate(x.date)}</span>
            </div>`;
          }).join("") : '<div style="padding:30px;color:#94a3b8;">No telemetry yet.</div>'}
        </div>
      </section>
      <section class="card-box">
        <div class="box-header"><h3>Source Network Performance</h3></div>
        <div class="source-bars">
          ${srcs.length ? srcs.map(s => {
            const maxS = Math.max(1, ...srcs.map(x => Number(x.value || 0)));
            return `<div class="source-item">
              <div class="source-logo">${esc(String(s.name).slice(0,2))}</div>
              <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(s.name)}</div>
              <div class="source-track"><div class="source-fill" style="width:${Math.round(Number(s.value||0)/maxS*100)}%;"></div></div>
              <div class="source-count">${Number(s.value||0)}</div>
            </div>`;
          }).join("") : '<div style="padding:20px;color:#94a3b8;">No source analytics yet.</div>'}
        </div>
      </section>
    </div>`;
}

const csv = x => String(x || "").split(",").map(s => s.trim()).filter(Boolean);
async function saveCfg(k, v) {
  try {
    await api("", { method: "POST", body: JSON.stringify({ action: "config", config_key: k, config_value: v }) });
    await load();
    render();
    toast("Configuration saved: " + k);
  } catch (e) { toast(e.message); }
}

function settings() {
  const s = S.data.config.search || {}, n = S.data.config.notification || {}, r = S.data.config.retention || {};
  $("main").innerHTML = `
    <div style="margin-bottom:20px;">
      <h1 style="font-size:24px; font-weight:800;">Configuration</h1>
      <p style="font-size:13px; color:var(--text-muted);">Runtime engine parameters and criteria.</p>
    </div>
    <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;">
      <section class="card-box">
        <h3 style="margin-bottom:12px;">Search Filters</h3>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div><label style="font-size:11px; font-weight:700;">Regions</label><input id="regions" class="form-input" style="width:100%;" value="${esc(arr(s.include_regions).join(', '))}"></div>
          <div><label style="font-size:11px; font-weight:700;">Countries</label><input id="countries" class="form-input" style="width:100%;" value="${esc(arr(s.include_countries).join(', '))}"></div>
          <button id="saveS" class="login-submit-btn" style="margin-top:8px;">Save Search Criteria</button>
        </div>
      </section>
      <section class="card-box">
        <h3 style="margin-bottom:12px;">Scoring Thresholds</h3>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div><label style="font-size:11px; font-weight:700;">Minimum Pass Score (0–100)</label><input id="min" type="number" class="form-input" style="width:100%;" value="${Number(s.minimum_match_score ?? 58)}"></div>
          <div><label style="font-size:11px; font-weight:700;">Strong Score Barrier</label><input id="strong" type="number" class="form-input" style="width:100%;" value="${Number(s.strong_match_score ?? 72)}"></div>
          <button id="saveM" class="login-submit-btn" style="margin-top:8px;">Save Matching Weights</button>
        </div>
      </section>
    </div>`;

  $("saveS").onclick = () => saveCfg("search", { ...s, include_regions: csv($("regions").value), include_countries: csv($("countries").value).map(x => x.toUpperCase()) });
  $("saveM").onclick = () => saveCfg("search", { ...s, minimum_match_score: Number($("min").value), strong_match_score: Number($("strong").value) });
}

function render() {
  if (S.page === "overview") overview();
  else if (S.page === "jobs") jobs();
  else if (S.page === "runs") runs();
  else if (S.page === "sources") sources();
  else if (S.page === "analytics") analytics();
  else settings();
}

</script>
</body>
</html>
